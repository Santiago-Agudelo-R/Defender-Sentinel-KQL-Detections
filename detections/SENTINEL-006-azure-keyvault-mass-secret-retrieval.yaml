id: SENTINEL-006
title: Mass Secret Retrieval from Azure Key Vault by a Single Caller
basis: SC-200 lab
platform: Microsoft Sentinel
severity: Medium
status: Experimental
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
techniques:
  - T1555.006
relevantTables:
  - AzureDiagnostics
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIPAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: ResourceId
description: >-
  Flags a caller (identity and IP) that successfully reads many distinct secrets from one Key Vault
  within an hour. Counting distinct secret URIs instead of raw operations avoids firing on
  applications that read the same secret repeatedly. VaultGet is excluded because it returns vault
  metadata, not secrets. Identity claim columns vary by token type in AzureDiagnostics, so they are
  read with column_ifexists. Tune DistinctSecretThreshold per vault.
query: |
  let DistinctSecretThreshold = 10;
  AzureDiagnostics
  | where TimeGenerated > ago(1h)
  | where ResourceProvider == 'MICROSOFT.KEYVAULT'
  | where OperationName in ('SecretGet', 'SecretListVersions', 'SecretBackup')
  | where ResultType == 'Success'
  | extend
      CallerObjectId = tostring(column_ifexists('identity_claim_oid_g', column_ifexists('identity_claim_http_schemas_microsoft_com_identity_claims_objectidentifier_g', ''))),
      CallerAppId = tostring(column_ifexists('identity_claim_appid_g', '')),
      SecretUri = tostring(split(requestUri_s, '?')[0])
  | summarize
      DistinctSecrets = dcount(SecretUri),
      OperationCount = count(),
      Operations = make_set(OperationName, 5),
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated)
      by ResourceId, CallerIPAddress, CallerObjectId, CallerAppId
  | where DistinctSecrets >= DistinctSecretThreshold
  | project FirstSeen, LastSeen, ResourceId, CallerIPAddress, CallerObjectId, CallerAppId, DistinctSecrets, OperationCount, Operations
  | order by DistinctSecrets desc
