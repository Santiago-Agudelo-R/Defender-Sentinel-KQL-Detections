id: SENTINEL-006
title: Anomalous Mass Secret Retrieval from Azure Key Vault
basis: SC-200 lab
platform: Microsoft Sentinel
severity: Medium
status: Lab-Validated
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
  - Collection
techniques:
  - T1552.004
  - T1530
relevantTables:
  - AzureDiagnostics
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIPAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: ResourceId
description: SC-200 lab analytic rule identifying callers performing an abnormally high volume of SecretGet or SecretList operations against an Azure Key Vault within a 1-hour window.
query: |
  let SecretGetThreshold = 15;
  AzureDiagnostics
  | where TimeGenerated > ago(1h)
  | where ResourceProvider == "MICROSOFT.KEYVAULT"
  | where OperationName in~ ("SecretGet", "SecretList", "VaultGet")
  | where ResultType == "Success"
  | extend PrincipalObjectId = tostring(identity_claim_oid_g)
  | extend AppId = tostring(identity_claim_appid_g)
  | summarize
      OperationCount = count(),
      DistinctOperations = make_set(OperationName, 10),
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated)
      by ResourceId, CallerIPAddress, PrincipalObjectId, AppId
  | where OperationCount >= SecretGetThreshold
  | project
      FirstSeen,
      LastSeen,
      ResourceId,
      CallerIPAddress,
      PrincipalObjectId,
      AppId,
      OperationCount,
      DistinctOperations
  | order by OperationCount desc
