id: MDO-002
title: Post-Sign-In Suspicious Exchange Online Inbox Rule or Forwarding Modification
basis: SC-200 lab
platform: Microsoft Defender XDR / Microsoft Sentinel
severity: High
status: Lab-Validated
queryFrequency: PT1H
queryPeriod: PT2H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - Collection
  - DefenseEvasion
techniques:
  - T1564.008
  - T1114.003
relevantTables:
  - CloudAppEvents
  - AADSignInEventsBeta
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: ObjectGuid
        columnName: AccountObjectId
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RuleClientIP
description: Correlates Exchange Online mailbox manipulation events (New-InboxRule, Set-InboxRule, UpdateInboxRules, Set-Mailbox forwarding) in CloudAppEvents against recent interactive Entra ID sign-ins in AADSignInEventsBeta to detect post-compromise BEC and AiTM session persistence.
query: |
  let lookback = 2h;
  let MailboxRuleChanges = CloudAppEvents
      | where Timestamp > ago(lookback)
      | where Application == "Microsoft Exchange Online"
      | where ActionType in ("New-InboxRule", "Set-InboxRule", "UpdateInboxRules", "Set-Mailbox")
      | extend RawParams = tostring(RawEventData.Parameters)
      | where RawParams has_any ("DeleteMessage", "MoveToFolder", "RSS Feeds", "Junk Email", "ForwardTo", "ForwardingSmtpAddress", "RedirectTo")
      | project
          RuleEventTime = Timestamp,
          AccountObjectId = tostring(AccountId),
          AccountDisplayName,
          ActionType,
          RuleClientIP = IPAddress,
          RawParams;
  let RecentSignIns = AADSignInEventsBeta
      | where Timestamp > ago(lookback)
      | where ErrorCode == 0
      | project
          SignInTime = Timestamp,
          AccountObjectId,
          AccountUpn,
          SignInIP = IPAddress,
          Country,
          RiskLevelDuringSignIn,
          SessionId;
  MailboxRuleChanges
  | join kind=inner RecentSignIns on AccountObjectId
  | where RuleEventTime between (SignInTime .. (SignInTime + 60m))
  | project
      RuleEventTime,
      SignInTime,
      AccountUpn,
      AccountObjectId,
      ActionType,
      RuleClientIP,
      SignInIP,
      Country,
      RiskLevelDuringSignIn,
      SessionId,
      RawParams
  | order by RuleEventTime desc
