id: MDO-002
title: Post-Sign-In Suspicious Exchange Online Inbox Rule or Forwarding Modification
basis: SC-200 lab
platform: Microsoft Defender XDR
severity: High
status: Lab-Validated
queryFrequency: PT1H
queryPeriod: PT1D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - Collection
  - DefenseEvasion
techniques:
  - T1564.008
  - T1114.003
relevantTables:
  - CloudAppEvents
  - AADSignInEventsBeta
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: ObjectGuid
        columnName: AccountObjectId
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RuleClientIP
description: Correlates Exchange Online mailbox persistence events (New-InboxRule, Set-InboxRule, UpdateInboxRules, Set-Mailbox forwarding) in CloudAppEvents against interactive and non-interactive Entra ID sign-ins in AADSignInEventsBeta, flagging cases where the inbox rule is created from a different IP than the initial sign-in (AiTM session cookie replay) or during a risky session.
query: |
  let lookback = 1d;
  let MailboxRuleChanges = CloudAppEvents
      | where Timestamp > ago(lookback)
      | where Application == "Microsoft Exchange Online"
      | where ActionType in ("New-InboxRule", "Set-InboxRule", "UpdateInboxRules", "Set-Mailbox")
      | extend RawParams = tostring(RawEventData.Parameters)
      | where RawParams has_any ("DeleteMessage", "MoveToFolder", "RSS Feeds", "Junk Email", "ForwardTo", "ForwardingSmtpAddress", "RedirectTo")
      | project
          RuleEventTime = Timestamp,
          AccountObjectId = tostring(AccountId),
          AccountDisplayName,
          ActionType,
          RuleClientIP = IPAddress,
          RawParams;
  let SignInActivity = AADSignInEventsBeta
      | where Timestamp > ago(lookback)
      | where ErrorCode == 0
      | project
          SignInTime = Timestamp,
          AccountObjectId,
          AccountUpn,
          SignInIP = IPAddress,
          Country,
          LogonType,
          RiskLevelDuringSignIn,
          SessionId;
  MailboxRuleChanges
  | join kind=inner SignInActivity on AccountObjectId
  | where RuleEventTime between (SignInTime .. (SignInTime + 12h))
  | where RuleClientIP != SignInIP or RiskLevelDuringSignIn in ("medium", "high", "50", "100") or tostring(LogonType) has "nonInteractive"
  | project
      RuleEventTime,
      SignInTime,
      AccountUpn,
      AccountObjectId,
      ActionType,
      RuleClientIP,
      SignInIP,
      IPMismatch = (RuleClientIP != SignInIP),
      Country,
      LogonType,
      RiskLevelDuringSignIn,
      SessionId,
      RawParams
  | order by RuleEventTime desc
