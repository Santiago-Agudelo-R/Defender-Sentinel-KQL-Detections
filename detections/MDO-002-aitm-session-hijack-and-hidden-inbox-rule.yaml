id: MDO-002
title: Inbox Rule or Forwarding Change from an IP Never Seen in the User's Sign-Ins
basis: SC-200 lab
platform: Microsoft Defender XDR
severity: High
status: Experimental
queryFrequency: PT1H
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
  - Collection
techniques:
  - T1564.008
  - T1114.003
relevantTables:
  - CloudAppEvents
  - EntraIdSignInEvents
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: ObjectGuid
        columnName: AccountObjectId
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RuleClientIP
description: >-
  After an AiTM phishing attack the attacker replays the stolen session cookie, so the inbox rule is
  created from an IP that never appears in the victim's own successful sign-ins. This query flags
  inbox rules that delete, move, forward or redirect mail, and mailbox forwarding changes, when the
  rule's client IP is absent from the user's successful sign-ins in the last 24 hours, the user had
  a medium or high risk sign-in, or the IP is a known anonymous proxy. Uses EntraIdSignInEvents,
  which replaced AADSignInEventsBeta on 2026-10-19. Expected noise: rules created through mobile
  carriers or VPN egress IPs that changed after sign-in.
query: |
  let MailboxRuleChanges = CloudAppEvents
      | where Timestamp > ago(1h)
      | where Application == 'Microsoft Exchange Online'
      | where ActionType in ('New-InboxRule', 'Set-InboxRule', 'UpdateInboxRules', 'Set-Mailbox')
      | extend RawParams = tostring(RawEventData.Parameters)
      | where RawParams has_any ('DeleteMessage', 'MoveToFolder', 'ForwardTo', 'ForwardAsAttachmentTo', 'RedirectTo', 'ForwardingSmtpAddress', 'ForwardingAddress')
      | where isnotempty(AccountObjectId) and isnotempty(IPAddress)
      | project RuleTime = Timestamp, AccountObjectId, AccountDisplayName, ActionType, RuleClientIP = IPAddress, IsAnonymousProxy, RawParams, ReportId;
  let SignInHistory = EntraIdSignInEvents
      | where Timestamp > ago(1d)
      | where ErrorCode == 0
      | summarize SignInIPs = make_set(IPAddress, 256), MaxRiskLevel = max(RiskLevelAggregated), AccountUpn = take_any(AccountUpn) by AccountObjectId;
  MailboxRuleChanges
  | join kind=leftouter SignInHistory on AccountObjectId
  | extend RuleIpSeenInSignIns = iff(isnull(SignInIPs), false, set_has_element(SignInIPs, RuleClientIP))
  | extend MaxRiskLevel = coalesce(MaxRiskLevel, 0)
  | where not(RuleIpSeenInSignIns) or MaxRiskLevel >= 50 or IsAnonymousProxy == true
  | project
      RuleTime,
      AccountUpn,
      AccountObjectId,
      AccountDisplayName,
      ActionType,
      RuleClientIP,
      RuleIpSeenInSignIns,
      MaxRiskLevel,
      IsAnonymousProxy,
      RawParams,
      ReportId
  | order by RuleTime desc
