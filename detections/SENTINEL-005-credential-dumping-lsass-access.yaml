id: SENTINEL-005
title: Credential Dumping via comsvcs.dll MiniDump or Direct LSASS Process Access
basis: SC-200 lab
platform: Microsoft Sentinel
severity: High
status: Lab-Validated
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
techniques:
  - T1003.001
relevantTables:
  - DeviceProcessEvents
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessCommandLine
description: SC-200 lab analytic rule detecting living-off-the-land LSASS memory dumping via rundll32.exe invoking comsvcs.dll (MiniDump), procdump.exe targeting lsass, or Task Manager silent dump parameters.
query: |
  DeviceProcessEvents
  | where Timestamp > ago(1h)
  | where (FileName in~ ("rundll32.exe", "rundll32") and ProcessCommandLine has_all ("comsvcs", "MiniDump"))
      or (FileName in~ ("procdump.exe", "procdump64.exe") and ProcessCommandLine has "lsass")
      or (ProcessCommandLine has_all ("createdump", "lsass"))
  | project
      Timestamp,
      DeviceId,
      DeviceName,
      AccountDomain,
      AccountName,
      InitiatingProcessFileName,
      InitiatingProcessCommandLine,
      FileName,
      ProcessCommandLine,
      SHA256
  | order by Timestamp desc
