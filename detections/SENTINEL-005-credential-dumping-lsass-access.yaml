id: SENTINEL-005
title: Credential Dumping via comsvcs.dll (MiniDump / Ordinal 24), ProcDump, or Direct LSASS Access
basis: SC-200 lab
platform: Microsoft Sentinel
severity: High
status: Lab-Validated
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
techniques:
  - T1003.001
relevantTables:
  - DeviceProcessEvents
  - DeviceEvents
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessCommandLine
description: SC-200 lab analytic rule detecting LSASS credential dumping across both process creation (rundll32 invoking comsvcs.dll via MiniDump or ordinal #24, procdump -ma/-mm even when targeting LSASS by PID, or createdump) and DeviceEvents OpenProcessApiCall targeting lsass.exe.
query: |
  let ProcessDumpAttempts = DeviceProcessEvents
      | where Timestamp > ago(1h)
      | where (
          FileName in~ ("rundll32.exe", "rundll32")
          and ProcessCommandLine has "comsvcs"
          and (ProcessCommandLine has "MiniDump" or ProcessCommandLine matches regex @"(?i)comsvcs(\.dll)?[\s,""]+#?24\b")
      )
      or (
          (FileName in~ ("procdump.exe", "procdump64.exe") or ProcessCommandLine has "-accepteula")
          and ProcessCommandLine matches regex @"(?i)\s-(ma|mm|mp)\s+(\d+|lsass)"
      )
      or (ProcessCommandLine has_all ("createdump", "lsass"))
      | project
          Timestamp,
          DeviceId,
          DeviceName,
          DetectionSource = "DeviceProcessEvents",
          AccountDomain,
          AccountName,
          InitiatingProcessFileName,
          InitiatingProcessCommandLine,
          FileName,
          ProcessCommandLine,
          SHA256;
  let LsassOpenProcessEvents = DeviceEvents
      | where Timestamp > ago(1h)
      | where ActionType == "OpenProcessApiCall"
      | where FileName =~ "lsass.exe"
      | where not(InitiatingProcessFileName in~ ("MsMpEng.exe", "SenseIR.exe", "csfalconservice.exe", "svchost.exe", "wmiprvse.exe"))
      | project
          Timestamp,
          DeviceId,
          DeviceName,
          DetectionSource = "DeviceEvents:OpenProcessApiCall",
          AccountDomain = InitiatingProcessAccountDomain,
          AccountName = InitiatingProcessAccountName,
          InitiatingProcessFileName,
          InitiatingProcessCommandLine,
          FileName,
          ProcessCommandLine = InitiatingProcessCommandLine,
          SHA256 = InitiatingProcessSHA256;
  union ProcessDumpAttempts, LsassOpenProcessEvents
  | order by Timestamp desc
