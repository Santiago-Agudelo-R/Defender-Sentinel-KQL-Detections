id: SENTINEL-005
title: LSASS Memory Dumping via comsvcs.dll, ProcDump, createdump, or Direct Process Access
basis: SC-200 lab
platform: Microsoft Sentinel
severity: High
status: Experimental
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
techniques:
  - T1003.001
relevantTables:
  - DeviceProcessEvents
  - DeviceEvents
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessCommandLine
description: >-
  Detects LSASS credential dumping through rundll32 and comsvcs.dll (MiniDump by name or by ordinal
  24), ProcDump full or mini dumps (by name or by PID, since attackers often pass the LSASS PID),
  createdump when its command line names lsass (createdump also runs for ordinary .NET
  crash dumps), and OpenProcessApiCall events that Defender for Endpoint records when a
  process opens lsass.exe. Defender samples OpenProcessApiCall events, so that branch is a hunting
  signal rather than complete coverage. Expected noise: ProcDump used by developers against other
  processes; review the target PID.
query: |
  let ProcessDumpAttempts = DeviceProcessEvents
      | where Timestamp > ago(1h)
      | where (FileName =~ 'rundll32.exe' and ProcessCommandLine has 'comsvcs'
              and (ProcessCommandLine has 'MiniDump' or ProcessCommandLine matches regex @'(?i)comsvcs(\.dll)?[\s,"]+#\+?0*24\b'))
          or ((FileName in~ ('procdump.exe', 'procdump64.exe') or ProcessCommandLine has '-accepteula')
              and ProcessCommandLine matches regex @'(?i)\s-m[amp]\s+(\d+|lsass)')
          // createdump.exe also runs for ordinary .NET crash dumps, so it only counts when it targets LSASS.
          or ((FileName =~ 'createdump.exe' or ProcessCommandLine has 'createdump') and ProcessCommandLine has 'lsass')
      | project
          Timestamp,
          DeviceId,
          DeviceName,
          DetectionSource = 'DeviceProcessEvents',
          AccountDomain,
          AccountName,
          InitiatingProcessFileName,
          InitiatingProcessCommandLine,
          FileName,
          ProcessCommandLine,
          SHA1;
  let LsassOpenProcess = DeviceEvents
      | where Timestamp > ago(1h)
      | where ActionType == 'OpenProcessApiCall' and FileName =~ 'lsass.exe'
      | where InitiatingProcessFileName !in~ ('MsMpEng.exe', 'MsSense.exe', 'SenseIR.exe', 'CSFalconService.exe', 'svchost.exe', 'wmiprvse.exe', 'lsass.exe')
      | project
          Timestamp,
          DeviceId,
          DeviceName,
          DetectionSource = 'DeviceEvents:OpenProcessApiCall',
          AccountDomain = InitiatingProcessAccountDomain,
          AccountName = InitiatingProcessAccountName,
          InitiatingProcessFileName,
          InitiatingProcessCommandLine,
          FileName,
          ProcessCommandLine = InitiatingProcessCommandLine,
          SHA1 = InitiatingProcessSHA1;
  union ProcessDumpAttempts, LsassOpenProcess
  | order by Timestamp desc
