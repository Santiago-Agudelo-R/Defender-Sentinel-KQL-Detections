id: MDI-003
title: Permanent High-Privilege Entra ID Role Assignment (Direct or Permanent PIM)
basis: Field experience
platform: Microsoft Sentinel
severity: High
status: Hunting / Lab-Validated
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
techniques:
  - T1098.003
relevantTables:
  - AuditLogs
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: InitiatedByUpn
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: TargetUpn
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: InitiatedByIP
description: Identifies active permanent directory role assignments for Tier-0 Entra ID roles across both direct assignments (Add member to role) and permanent PIM assignments (Add member to role outside of PIM (permanent), Add member to role in PIM completed (permanent)), while excluding time-bound PIM activations.
query: |
  let Tier0Roles = dynamic([
      "Global Administrator",
      "Company Administrator",
      "Privileged Role Administrator",
      "Security Administrator",
      "Intune Administrator",
      "Exchange Administrator",
      "Conditional Access Administrator"
  ]);
  let PermanentRoleOps = dynamic([
      "Add member to role",
      "Add member to role outside of PIM (permanent)",
      "Add member to role in PIM completed (permanent)"
  ]);
  AuditLogs
  | where TimeGenerated > ago(1h)
  | where OperationName in~ (PermanentRoleOps)
  | where Result == "success"
  | extend InitiatedByApp = tostring(InitiatedBy.app.displayName)
  | where not(OperationName =~ "Add member to role" and InitiatedByApp == "MS-PIM")
  | extend InitiatedByUpn = tostring(InitiatedBy.user.userPrincipalName)
  | extend InitiatedByIP = tostring(InitiatedBy.user.ipAddress)
  | extend TargetUpn = coalesce(
      tostring(TargetResources[0].userPrincipalName),
      tostring(TargetResources[2].userPrincipalName)
  )
  | mv-expand TargetRes = TargetResources
  | mv-expand Prop = TargetRes.modifiedProperties
  | where tostring(Prop.displayName) in~ ("Role.DisplayName", "RoleDefinitionOriginId", "DisplayName")
  | extend AssignedRole = trim('"', tostring(Prop.newValue))
  | where AssignedRole in~ (Tier0Roles)
  | project
      TimeGenerated,
      OperationName,
      AssignedRole,
      TargetUpn,
      InitiatedByUpn,
      InitiatedByApp,
      InitiatedByIP,
      CorrelationId
  | order by TimeGenerated desc
