id: MDE-001
title: Microsoft Defender Antivirus or EDR Sensor Tampering
basis: Field experience
platform: Microsoft Defender XDR
severity: High
status: Experimental
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
techniques:
  - T1562.001
relevantTables:
  - DeviceProcessEvents
  - DeviceEvents
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessCommandLine
description: >-
  Flags attempts to switch off Defender Antivirus protections (Set-MpPreference parameters and
  their short aliases such as -drtm), add Defender exclusions, stop or reconfigure the WinDefend or
  Sense services, or remove definitions. PowerShell -EncodedCommand payloads are decoded so
  encoded tampering is matched too. Also returns TamperingAttempt events that Defender raises when
  Tamper Protection blocks a change. Expected noise: software deployment tools that add exclusions;
  tune with an allowlist of approved initiating processes.
query: |
  let ProcessTampering = DeviceProcessEvents
      | where Timestamp > ago(1h)
      | where FileName in~ ("powershell.exe", "pwsh.exe", "cmd.exe", "sc.exe", "net.exe", "net1.exe", "reg.exe", "MpCmdRun.exe")
      // -EncodedCommand payloads are UTF-16LE Base64: decode and strip the NUL bytes.
      | extend EncodedPayload = extract(@'(?i)\s-e[a-z]*\s+([A-Za-z0-9+/=]{16,})', 1, ProcessCommandLine)
      | extend DecodedCommand = iff(isnotempty(EncodedPayload), replace_regex(base64_decode_tostring(EncodedPayload), @'\x00', ''), '')
      | extend Text = strcat(ProcessCommandLine, ' ', DecodedCommand)
      // 'has' matches whole terms, so prefixes and aliases are matched with regex instead.
      | where Text matches regex @'(?i)-(Disable(RealtimeMon|BehaviorMon|IOAV|ScriptScan|IntrusionPrev|ArchiveScan|BlockAtFirstSeen)[a-z]*|drtm|dbm|dioavp|dscrptsc)\b'
          or Text matches regex @'(?i)\b(stop|delete|config)\s+(WinDefend|Sense|WdFilter|WdNisSvc)\b'
          or (Text has_any ('Add-MpPreference', 'Set-MpPreference') and Text matches regex @'(?i)-Exclusion(Path|Process|Extension|IpAddress)\b')
          or Text matches regex @'(?i)Windows Defender\\(Exclusions|Real-Time Protection)'
          or Text matches regex @'(?i)DisableAntiSpyware|-RemoveDefinitions'
      | project
          Timestamp,
          DeviceId,
          DeviceName,
          Source = 'DeviceProcessEvents',
          ActionType,
          AccountDomain = InitiatingProcessAccountDomain,
          AccountName = InitiatingProcessAccountName,
          InitiatingProcessFileName,
          FileName,
          ProcessCommandLine,
          DecodedCommand,
          SHA1,
          ReportId;
  let BlockedTampering = DeviceEvents
      | where Timestamp > ago(1h)
      | where ActionType == 'TamperingAttempt'
      | project
          Timestamp,
          DeviceId,
          DeviceName,
          Source = 'DeviceEvents',
          ActionType,
          AccountDomain = InitiatingProcessAccountDomain,
          AccountName = InitiatingProcessAccountName,
          InitiatingProcessFileName,
          FileName,
          ProcessCommandLine = InitiatingProcessCommandLine,
          DecodedCommand = '',
          SHA1 = InitiatingProcessSHA1,
          ReportId;
  union ProcessTampering, BlockedTampering
  | order by Timestamp desc
