id: MDE-001
title: Microsoft Defender Sensor Tampering and Realtime Monitoring Disablement
basis: Field experience
platform: Microsoft Defender XDR
severity: High
status: Production
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
techniques:
  - T1562.001
relevantTables:
  - DeviceProcessEvents
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: InitiatingProcessAccountName
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessCommandLine
description: Detects command-line attempts to stop the Microsoft Defender Antivirus or EDR sensor services (WinDefend, Sense), disable Real-Time Monitoring via PowerShell Set-MpPreference, or add broad path exclusions in DeviceProcessEvents.
query: |
  DeviceProcessEvents
  | where Timestamp > ago(1h)
  | where FileName in~ ("powershell.exe", "pwsh.exe", "cmd.exe", "sc.exe", "net.exe", "reg.exe", "MpCmdRun.exe")
  | where ProcessCommandLine has_any (
      "DisableRealtimeMonitoring",
      "DisableBehaviorMonitoring",
      "DisableIOAVProtection",
      "DisableScriptScanning",
      "Add-MpPreference -ExclusionPath",
      "stop WinDefend",
      "stop Sense",
      "config WinDefend start= disabled",
      "DisableAntiSpyware"
  )
  | where not(InitiatingProcessAccountName in~ ("system", "local service") and InitiatingProcessFileName =~ "MsMpEng.exe")
  | project
      Timestamp,
      DeviceId,
      DeviceName,
      InitiatingProcessAccountDomain,
      InitiatingProcessAccountName,
      InitiatingProcessFileName,
      FileName,
      ProcessCommandLine,
      SHA256,
      ReportId
  | order by Timestamp desc
